version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - lll
    - bodyclose
    - asciicheck
    - dupl
    - errorlint
    - dogsled
    - durationcheck
    - gocritic
    - gocyclo
    - gosec
    - exhaustive
    - forbidigo
    - forcetypeassert
    - goheader
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - importas
    - makezero
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - predeclared
    - promlinter
    - rowserrcheck
    - sqlclosecheck
    - testpackage
    - thelper
    - unconvert
    - unparam
    - wastedassign
    - whitespace
  settings:
    lll:
      line-length: 220
  exclusions:
    paths:
      - internal/test/

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/futurehomeno/edge-easee-adapter)
    goimports:
      local-prefixes:
        - github.com/futurehomeno/edge-easee-adapter
